name: Extract NORLEX Final ZIP

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  workflows: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify ZIP exists
        run: |
          test -f NORLEX_final.zip

      - name: Extract NORLEX ZIP
        run: |
          unzip -o NORLEX_final.zip -d .
          rm NORLEX_final.zip

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "Extract NORLEX final project" || echo "No changes to commit"
          git push origin HEAD:main
