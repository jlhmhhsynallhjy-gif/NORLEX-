name: إنشاء ملف APK لنظام أندرويد

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: تنزيل المشروع
        uses: actions/checkout@v4

      - name: إعداد Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.0'
          channel: stable
          cache: true

      - name: تثبيت التبعيات
        run: flutter pub get

      - name: بناء APK
        run: flutter build apk --release

      - name: رفع APK
        uses: actions/upload-artifact@v4
        with:
          name: norlex-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
