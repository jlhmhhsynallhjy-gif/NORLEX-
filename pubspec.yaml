name: norlex
description: NORLEX - Unified AI and Digital Platform
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.8.0 <4.0.0"
  flutter: ">=3.32.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  dio: ^5.8.0
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  uuid: ^4.5.1
  json_annotation: ^4.9.0
  path_provider: ^2.1.5
  file_picker: ^10.2.0
  share_plus: ^11.0.0
  connectivity_plus: ^6.1.4
  permission_handler: ^12.0.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  flutter_markdown_plus: ^1.0.5
  flutter_highlight: ^0.7.0
  record: ^6.0.0
  just_audio: ^0.10.4
  speech_to_text: ^7.1.0
  pdf: ^3.11.3
  printing: ^5.14.2
  drift: ^2.27.0
  sqlite3_flutter_libs: ^0.5.32

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.5.4
  json_serializable: ^6.9.5
  drift_dev: ^2.27.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/
